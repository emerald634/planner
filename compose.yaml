name: bitrix-missed-calls-bot

services:
  bot:
    build: .
    env_file:
      - .env
    environment:
      ACCESS_DB_PATH: /data/access.db
    volumes:
      - type: bind
        source: ./data
        target: /data
        bind:
          create_host_path: false
    restart: unless-stopped
    init: true
    stop_grace_period: 30s
    read_only: true
    tmpfs:
      - /tmp
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
