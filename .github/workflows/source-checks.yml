name: Synthetic source checks
on:
  pull_request:
  push:
    branches: ["review/complete-workspace-20261028"]
permissions:
  contents: read
jobs:
  synthetic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install -r requirements-workspace-dev.txt
      - run: python tools/check_repository.py
      - run: python -B -m tests.run_foundation_checks
      - run: python -B web/tools/run_session_checks.py
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - uses: pnpm/action-setup@v4
        with: {version: '11.25.0'}
      - run: pnpm --dir web/frontend install --frozen-lockfile
      - run: pnpm --dir web/frontend test
      - run: pnpm --dir web/frontend lint
      - run: pnpm --dir web/frontend build
      - run: pnpm --dir miniapp install --frozen-lockfile
      - run: pnpm --dir miniapp build
